<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      var bp = "{{.BasePath}}";
      if (!bp && window.location && window.location.pathname && window.location.pathname !== "/") {
        var firstSegment = window.location.pathname.split("/").filter(Boolean)[0];
        if (firstSegment && firstSegment.indexOf(".") === -1) {
          bp = "/" + firstSegment;
        }
      }
      window.BASE_PATH = bp || "";
    })();
  </script>
  <link href="{{.BasePath}}/style.css" rel="stylesheet">

  <nav class="topnav" role="navigation">
    <div class="nav-wrapper">
      <a href="{{.BasePath}}/" class="brand-logo">
        <i class="material-icons brand-mark">public</i>
        <span class="brand-name">AcuGIS Portal</span>
      </a>

      <ul class="right hide-on-med-and-down topnav-actions">
        <li class="hide" id="admin-nav-item"><a href="{{.BasePath}}/administration" class="topnav-link" id="admin-nav-link"><i class="material-icons left">admin_panel_settings</i>Administration</a></li>

        <li><a href="#" class="topnav-link" id="login-link"><i class="material-icons left">login</i>Login</a></li>
        <li>

            <i class="material-icons">account_circle</i>
          </a>
        </li>
      </ul>
    </div>
  </nav>

      <div class="portal-search-section" role="search">

          <i class="material-icons portal-search-icon" aria-hidden="true">search</i>

            id="portal-search"

            type="search"
            autocomplete="off"
            placeholder="&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Search maps, dashboards, reports, datasets, and applications..."
          >
        </div>
        <div class="portal-category-filter" id="portal-category-filter" aria-label="Filter by resource type">
          <button class="chip portal-chip active" type="button" data-type="">All</button>
          <button class="chip portal-chip" type="button" data-type="map">Maps</button>
          <button class="chip portal-chip" type="button" data-type="dashboard">Dashboards</button>
          <button class="chip portal-chip" type="button" data-type="report">Reports</button>
          <button class="chip portal-chip" type="button" data-type="dataset">Datasets</button>
          <button class="chip portal-chip" type="button" data-type="external">Apps</button>
        </div>
      </div>
    </div>
