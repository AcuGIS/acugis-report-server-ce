openapi: 3.0.3
info:
  title: AcuGIS Report Server API (auth stub — superseded)
  version: 1.0.0
  description: |
    **Superseded.** Use the modular specification in [`../openapi/`](../openapi/)
    and live endpoints `GET /api/openapi.yaml` / `GET /api/openapi.json`.
    See [`openapi.md`](./openapi.md).

    Historical auth/token fragment retained for reference.
servers:
  - url: /go
    description: Typical JRS_BASE_PATH mount
security:
  - BearerAuth: []
  - SessionCookie: []
paths:
  /api/v1/auth/login:
    post:
      summary: Create browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /api/v1/auth/logout:
    post:
      summary: Clear browser session
      security: []
      responses:
        "200":
          description: Cookie cleared
  /api/v1/auth/me:
    get:
      summary: Current authenticated user
      responses:
        "200":
          description: User identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/tokens:
    get:
      summary: List personal access tokens (metadata only)
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/PersonalAccessToken"
    post:
      summary: Create personal access token
      description: Returns the plaintext token once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
  /api/v1/auth/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    put:
      summary: Update token metadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTokenRequest"
      responses:
        "200":
          description: Updated metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAccessToken"
    delete:
      summary: Revoke token (or hard-delete with purge=1)
      parameters:
        - name: purge
          in: query
          schema:
            type: boolean
      responses:
        "204":
          description: Revoked or deleted
  /api/v1/auth/tokens/{id}/rotate:
    post:
      summary: Rotate token
      parameters:
        - $ref: "#/components/parameters/TokenId"
      responses:
        "201":
          description: New plaintext token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: jrs_PAT
      description: Personal access token (`jrs_…`)
    SessionCookie:
      type: apiKey
      in: cookie
      name: jrs_session
  parameters:
    TokenId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    Me:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        email: { type: string }
        groups:
          type: array
          items: { type: string }
        is_admin: { type: boolean }
        permissions:
          type: array
          items: { type: string }
          description: Reserved; tokens inherit full user ACL
    PersonalAccessToken:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        token_prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        active: { type: boolean }
    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        expires_in:
          type: string
          enum: [never, 30d, 90d, 1y, custom]
        expires_at:
          type: string
          description: RFC3339 or YYYY-MM-DD when expires_in=custom
    UpdateTokenRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        expires_in: { type: string }
        expires_at: { type: string }
    CreateTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Plaintext PAT; shown only once
        id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        name: { type: string }
        message: { type: string }
