<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}} - {{.ProductName}}</title>
<style id="fed-shell-critical">
.fed-shell-menu-btn{display:none!important}
.designer-form-alert{white-space:pre-wrap;word-break:break-word}
.fed-shell-backdrop{display:none!important}
body.fed-shell-body{margin:0;padding-left:var(--fed-shell-sidebar-width,250px);box-sizing:border-box}
.fed-shell-sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--fed-shell-sidebar-width,250px);z-index:1000;overflow:hidden;background:#f0f4f9}
@media (max-width:992px){
body.fed-shell-body{padding-left:0}
.fed-shell-sidebar{transform:translateX(-100%)}
body.fed-shell-open .fed-shell-sidebar{transform:translateX(0)}
body.fed-shell-open .fed-shell-backdrop{display:block!important}
.fed-shell-menu-btn{display:flex!important;align-items:center;justify-content:center;position:fixed;top:12px;left:12px;z-index:1002;width:44px;height:44px;border:none;border-radius:50%;background:#fff;cursor:pointer}
}
</style>
    <link rel="stylesheet" href="{{.AssetsURL}}/shell.css?v=20260727f" id="fed-shell-css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
      window.FEDERATION_SHELL_MOUNT = {{.ShellMount}};
      window.BASE_PATH = {{.ShellMount}};
      window.FEDERATION_PHP_MOUNT = {{.PHPMount}};
      window.FEDERATION_SHELL_ASSETS = {{.AssetsBase}};
    </script>
    <script src="{{.AssetsURL}}/shell-bootstrap.js?v=20261011b"></script>
    <style>{{.CSS}}</style>
</head>
<body data-federation-app="{{.FederationApp}}" class="fed-shell-body">
<aside id="fed-shell-sidebar" class="fed-shell-sidebar" aria-label="Application navigation">
    {{if .ShowSidebarBrand}}<a class="fed-shell-sidebar-brand" href="{{.BrandHome}}"><i class="material-icons">assessment</i><span>{{.ProductName}}</span></a>{{end}}
    <div class="fed-shell-nav-scroll" data-fed-shell-nav-mount data-fed-ssr="1">{{.SidebarNav}}</div>
</aside>
<button type="button" class="fed-shell-menu-btn" aria-label="Open menu" hidden><i class="material-icons">menu</i></button>
<div class="fed-shell-backdrop"></div>
<main class="main-content">
<header class="page-header">
    <div>
        <h1 class="page-title">{{.Title}}</h1>
        <p class="page-subtitle">{{.Subtitle}}</p>
    </div>
</header>
{{if .Message}}
    <div class="card-panel red lighten-4 red-text text-darken-4 designer-form-alert" role="alert">{{.Message}}</div>
{{end}}
<div class="card">
    <div class="card-content">
        <span class="card-title">{{if .Importing}}Designer Project{{else}}Report{{end}}</span>
        <form method="post" action="{{.Action}}" {{if .Importing}}enctype="multipart/form-data"{{end}}>
            <div class="row">
                <div class="input-field col s12 m6">
                    <input type="text" id="name" name="name" {{if not .Importing}}required{{end}} placeholder="{{if .Importing}}Defaults to the project name{{else}}Enter report name{{end}}">
                    <label for="name" class="active">Report Name</label>
                </div>
                {{if not .Importing}}
                <div class="input-field col s12 m6">
                    <input type="text" id="description" name="description" placeholder="Shown on report cards">
                    <label for="description" class="active">Description</label>
                </div>
                {{end}}
                <div class="input-field col s12 m6">
                    <select id="folder_id" name="folder_id">
                        {{range .Folders}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
                    </select>
                    <label>Folder</label>
                </div>
                {{if .Importing}}
                <div class="file-field input-field col s12 m6">
                    <div class="btn blue-grey"><span>ZIP</span>
                        <input type="file" id="file" name="file" accept=".zip,application/zip" required>
                    </div>
                    <div class="file-path-wrapper">
                        <input class="file-path validate" type="text" placeholder="Desktop project ZIP">
                    </div>
                </div>
                {{end}}
            </div>
            <div class="form-actions">
                <a href="{{.Cancel}}" class="btn-flat waves-effect">Cancel</a>
                <button type="submit" class="btn waves-effect waves-light teal">{{.SubmitLabel}}</button>
            </div>
        </form>
    </div>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    if (!window.M) return;
    M.FormSelect.init(document.querySelectorAll("select"));
    M.updateTextFields();
});
</script>
</body>
</html>
