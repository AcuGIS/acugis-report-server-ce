<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AcuGIS Embed — Parameters</title>
</head>
<body>
  <div id="report" style="height:80vh"></div>
  <script src="http://localhost:9088/sdk/acugis-report.js"></script>
  <script>
    const report = AcuGIS.embedReport({
      server: "http://localhost:9088",
      target: "#report",
      reportId: "REPORT_KEY",
      token: "emb_REPLACE_ME",
      parameters: { p_country: "USA", p_state: ["CA", "TX"] }
    });
    report.on("load", () => console.log("loaded"));
  </script>
</body>
</html>
