  /reports/execute:
    get:
      description: |
        Proxies Jasper report render. Query `_repName` or `report` required.
        `_repFormat` defaults to `html`.

        **Supported formats:** `html`, `pdf`, `xlsx`, `xls`, `csv`, `docx`, `rtf`,
        `odt`, `ods`, `pptx`, `xml`.

        Additional query parameters are forwarded as report parameters.
        Errors are typically `text/plain` (not JSON).
        Anonymous access allowed when Public group grants view ACL.
      operationId: runReport
      parameters:
        - description: Report key (alias of `report`)
          example: nycdata
          in: query
          name: _repName
          schema:
            type: string
        - description: Report key (alias of `_repName`)
          in: query
          name: report
          schema:
            type: string
        - in: query
          name: _repFormat
          schema:
            default: html
            enum:
              - html
              - pdf
              - xlsx
              - xls
              - csv
              - docx
              - rtf
              - odt
              - ods
              - pptx
              - xml
            type: string
        - description: Public datasource name for this execution.
          in: query
          name: datasource
          schema:
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
            application/pdf:
              schema:
                format: binary
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                format: binary
                type: string
            text/csv:
              schema:
                type: string
            text/html:
              schema:
                type: string
          description: Rendered report bytes
        "400":
          $ref: '#/components/responses/PlainTextError'
        "403":
          $ref: '#/components/responses/PlainTextError'
        "404":
          $ref: '#/components/responses/PlainTextError'
        "503":
          $ref: '#/components/responses/PlainTextError'
      summary: Execute / render report
      tags:
        - Execution
    post:
      description: |
        Same as GET. The public `datasource` query parameter is accepted the same way.
        The request body and Content-Type are forwarded to Jasper.
      operationId: runReportPost
      parameters:
        - in: query
          name: _repName
          schema:
            type: string
        - in: query
          name: report
          schema:
            type: string
        - in: query
          name: _repFormat
          schema:
            default: html
            enum:
              - html
              - pdf
              - xlsx
              - xls
              - csv
              - docx
              - rtf
              - odt
              - ods
              - pptx
              - xml
            type: string
        - description: Public datasource name for this execution.
          in: query
          name: datasource
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
          application/octet-stream:
            schema:
              format: binary
              type: string
          application/x-www-form-urlencoded:
            schema:
              additionalProperties:
                type: string
              type: object
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
            application/pdf:
              schema:
                format: binary
                type: string
          description: Rendered report bytes
        "400":
          $ref: '#/components/responses/PlainTextError'
        "403":
          $ref: '#/components/responses/PlainTextError'
        "503":
          $ref: '#/components/responses/PlainTextError'
      summary: Execute / render report (POST)
      tags:
        - Execution
