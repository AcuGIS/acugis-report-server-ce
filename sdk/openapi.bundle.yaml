components:
  parameters:
    DatasourceId:
      description: Datasource numeric id
      in: path
      name: id
      required: true
      schema:
        format: int64
        type: integer
    FolderId:
      description: Folder numeric id
      example: 12
      in: path
      name: id
      required: true
      schema:
        format: int64
        type: integer
    ParameterName:
      description: Report parameter name
      example: city
      in: path
      name: name
      required: true
      schema:
        type: string
    ReportKey:
      description: Report key (`[a-z0-9_-]+`)
      example: nycdata
      in: path
      name: key
      required: true
      schema:
        pattern: ^[a-z0-9_-]+$
        type: string
    ResourceUUID:
      description: Content resource UUID
      in: path
      name: uuid
      required: true
      schema:
        format: uuid
        type: string
    TokenId:
      description: Personal access token id
      in: path
      name: id
      required: true
      schema:
        format: int64
        type: integer
    ViewKey:
      description: Saved explorer view key
      in: path
      name: key
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      content:
        application/json:
          example:
            error: bad request
          schema:
            $ref: '#/components/schemas/Error'
      description: Invalid request
    Forbidden:
      content:
        application/json:
          example:
            error: Permission denied
          schema:
            $ref: '#/components/schemas/Error'
      description: Permission denied
    NotFound:
      content:
        application/json:
          example:
            error: not found
          schema:
            $ref: '#/components/schemas/Error'
      description: Resource not found
    PlainTextError:
      content:
        text/plain:
          example: Jasper gateway unavailable
          schema:
            type: string
      description: Plain-text error (Jasper execute/image gateways)
    ServiceUnavailable:
      content:
        application/json:
          example:
            error: application database unavailable
          schema:
            $ref: '#/components/schemas/Error'
      description: Dependency unavailable
    Unauthorized:
      content:
        application/json:
          example:
            error: authentication required
          schema:
            $ref: '#/components/schemas/Error'
      description: Authentication required
    ValidationError:
      content:
        application/json:
          example:
            error: validation failed
            errors:
              - data_source is required
          schema:
            $ref: '#/components/schemas/ValidationError'
      description: Validation failed
  schemas:
    Breadcrumb:
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
      type: object
    BrowseResult:
      properties:
        breadcrumbs:
          items:
            $ref: '#/components/schemas/Breadcrumb'
          type: array
        folder:
          $ref: '#/components/schemas/Folder'
        folders:
          items:
            $ref: '#/components/schemas/Folder'
          type: array
        items:
          items:
            $ref: '#/components/schemas/ContentItem'
          type: array
      type: object
    ContentItem:
      properties:
        acl_inherit:
          type: boolean
        content_key:
          type: string
        content_type:
          enum:
            - jasper_report
            - dashboard
            - explorer_view
            - template
            - content_resource
            - content_folder
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          format: int64
          type: integer
        display_name:
          type: string
        extension:
          type: string
        folder_id:
          format: int64
          type: integer
        folder_path:
          type: string
        height:
          type: integer
        id:
          format: int64
          type: integer
        mime_type:
          type: string
        original_filename:
          type: string
        resource_type:
          type: string
        size_bytes:
          format: int64
          type: integer
        sort_order:
          type: integer
        updated_at:
          format: date-time
          type: string
        width:
          type: integer
      type: object
    CreateFolderRequest:
      properties:
        acl_inherit:
          type: boolean
        description:
          type: string
        icon:
          type: string
        name:
          example: Finance
          type: string
        parent_id:
          description: 0 = Home/root
          example: 0
          format: int64
          type: integer
        sort_order:
          type: integer
      required:
        - name
      type: object
    CreateTokenRequest:
      properties:
        description:
          type: string
        expires_at:
          description: RFC3339 or YYYY-MM-DD when expires_in=custom
          example: "2027-01-01"
          type: string
        expires_in:
          default: never
          enum:
            - never
            - 30d
            - 90d
            - 1y
            - custom
          type: string
        name:
          example: CI Server
          type: string
      required:
        - name
      type: object
    DatasourceMutationResponse:
      properties:
        message:
          type: string
        ok:
          type: boolean
      type: object
    DatasourceName:
      properties:
        name:
          example: reporting_db
          type: string
      type: object
    Diagnostics:
      additionalProperties: true
      description: Ops diagnostics (redacted config, table presence, flags)
      properties:
        app_version:
          type: string
        base_path:
          type: string
        environment:
          type: string
        go_version:
          type: string
        service:
          type: string
        timestamp:
          format: date-time
          type: string
      type: object
    Error:
      additionalProperties: true
      properties:
        code:
          description: Optional machine code (e.g. unsupported_datasource)
          type: string
        error:
          type: string
        hint:
          type: string
        service:
          description: Present on some 404 responses
          type: string
      required:
        - error
      type: object
    ExplorerAggregate:
      properties:
        alias:
          type: string
        column:
          type: string
        func:
          enum:
            - COUNT
            - SUM
            - AVG
            - MIN
            - MAX
          type: string
      type: object
    ExplorerColumn:
      properties:
        is_geometry:
          type: boolean
        is_primary:
          type: boolean
        name:
          type: string
        nullable:
          type: boolean
        ordinal:
          type: integer
        type:
          type: string
        udt_name:
          type: string
      type: object
    ExplorerFilter:
      properties:
        column:
          type: string
        operator:
          enum:
            - =
            - <>
            - '>'
            - <
            - '>='
            - <=
            - LIKE
            - IN
            - BETWEEN
            - IS NULL
            - IS NOT NULL
          type: string
        value: {}
        value_to: {}
        values:
          items: {}
          type: array
      type: object
    ExplorerQuery:
      description: Visual query request (`QueryRequest`)
      properties:
        aggregates:
          items:
            $ref: '#/components/schemas/ExplorerAggregate'
          type: array
        columns:
          example:
            - id
            - name
            - geom
          items:
            type: string
          type: array
        datasource:
          example: reporting_db
          type: string
        filters:
          items:
            $ref: '#/components/schemas/ExplorerFilter'
          type: array
        group_by:
          items:
            type: string
          type: array
        limit:
          type: integer
        offset:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        report_cache_key:
          type: string
        report_key:
          type: string
        schema:
          example: public
          type: string
        sort:
          items:
            $ref: '#/components/schemas/ExplorerSort'
          type: array
        source_mode:
          enum:
            - table
            - report
          type: string
        table:
          example: parcels
          type: string
      type: object
    ExplorerResult:
      description: Paged query result (`QueryResult`)
      properties:
        columns:
          items:
            type: string
          type: array
        engine:
          type: string
        executed_at:
          format: date-time
          type: string
        page:
          type: integer
        page_size:
          type: integer
        rows:
          items:
            additionalProperties: true
            type: object
          type: array
        total_rows:
          format: int64
          type: integer
        truncated:
          type: boolean
      type: object
    ExplorerSort:
      properties:
        column:
          type: string
        direction:
          enum:
            - ASC
            - DESC
          type: string
      type: object
    FavoriteRequest:
      properties:
        content_key:
          type: string
        content_type:
          type: string
        favorite:
          default: true
          type: boolean
      required:
        - content_type
        - content_key
      type: object
    FeatureCollection:
      description: GeoJSON FeatureCollection (map reports / explorer)
      properties:
        crs:
          additionalProperties: true
          type: object
        detail:
          type: string
        error:
          type: string
        features:
          items:
            additionalProperties: true
            type: object
          type: array
        mapDefinition:
          additionalProperties: true
          type: object
        meta:
          additionalProperties: true
          type: object
        type:
          enum:
            - FeatureCollection
          type: string
      required:
        - type
        - features
      type: object
    Folder:
      properties:
        acl_inherit:
          type: boolean
        child_folder_count:
          type: integer
        child_item_count:
          type: integer
        created_at:
          format: date-time
          type: string
        created_by:
          format: int64
          type: integer
        description:
          type: string
        icon:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
        parent_id:
          format: int64
          nullable: true
          type: integer
        path:
          type: string
        sort_order:
          type: integer
        updated_at:
          format: date-time
          type: string
      type: object
    FolderPermissions:
      properties:
        group_names:
          example:
            - Administrators
            - Analysts
          items:
            type: string
          type: array
      type: object
    FolderTreeNode:
      properties:
        children:
          items:
            $ref: '#/components/schemas/FolderTreeNode'
          type: array
        icon:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
        parent_id:
          format: int64
          nullable: true
          type: integer
      type: object
    Group:
      description: Group entity (REST pending; schema reserved for future /api/v1/groups)
      properties:
        description:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
      type: object
    HealthResponse:
      properties:
        service:
          example: acugis-report-server-go
          type: string
        status:
          example: ok
          type: string
      type: object
    JasperContextResponse:
      properties:
        notes:
          items:
            type: string
          type: array
        ok:
          type: boolean
        path:
          type: string
      type: object
    LoginRequest:
      properties:
        password:
          format: password
          type: string
        username:
          example: admin
          type: string
      required:
        - username
        - password
      type: object
    MapColumnsResult:
      properties:
        columns:
          items:
            properties:
              name:
                type: string
              type:
                type: string
            type: object
          type: array
        error:
          type: string
        geometry_column:
          type: string
        geometry_columns:
          items:
            type: string
          type: array
        report_fields:
          items:
            type: string
          type: array
        schema:
          type: string
        srid:
          type: integer
        table:
          type: string
      type: object
    MapExtent:
      properties:
        p_geometry:
          description: Geometry/WKT or encoded spatial filter for report params
          type: string
        p_srid:
          example: 4326
          type: integer
      type: object
    MapLayerMeta:
      properties:
        error:
          type: string
        geometry_column:
          type: string
        geometry_columns:
          items:
            type: string
          type: array
        geometry_type:
          type: string
        report_fields:
          items:
            type: string
          type: array
        schema:
          type: string
        spatial_capable:
          type: boolean
        srid:
          type: integer
        table:
          type: string
        type:
          type: string
      type: object
    MoveContentRequest:
      properties:
        acl_inherit:
          type: boolean
        content_key:
          description: For explorer_view, use owner/viewKey (e.g. alice/sales-overview)
          type: string
        content_type:
          enum:
            - jasper_report
            - dashboard
            - explorer_view
            - template
            - content_resource
            - content_folder
          type: string
        display_name:
          type: string
        folder_id:
          format: int64
          type: integer
        sort_order:
          type: integer
      required:
        - folder_id
        - content_type
        - content_key
      type: object
    MoveFolderRequest:
      properties:
        parent_id:
          format: int64
          type: integer
        sort_order:
          type: integer
      required:
        - parent_id
      type: object
    ParameterLookupResponse:
      properties:
        options:
          items:
            $ref: '#/components/schemas/ParameterOption'
          type: array
      type: object
    ParameterOption:
      properties:
        label:
          type: string
        value:
          type: string
      type: object
    ReadyResponse:
      properties:
        checks:
          additionalProperties: true
          type: object
        service:
          type: string
        status:
          enum:
            - ready
            - not_ready
          type: string
      type: object
    Report:
      additionalProperties: true
      description: Full report definition JSON (shape varies by report type)
      properties:
        access_groups:
          items:
            type: string
          type: array
        datasource:
          type: string
        description:
          type: string
        embeddedMap:
          additionalProperties: true
          type: object
        format:
          type: string
        mapDefinition:
          additionalProperties: true
          type: object
        name:
          type: string
        parameters:
          items:
            additionalProperties: true
            type: object
          type: array
        report:
          type: string
        type:
          type: string
      type: object
    ReportConfig:
      additionalProperties: true
      description: Viewer configuration with enriched parameters and optional map metadata
      properties:
        map:
          $ref: '#/components/schemas/MapLayerMeta'
        mapDefinition:
          additionalProperties: true
          type: object
        parameters:
          items:
            additionalProperties: true
            type: object
          type: array
        report:
          type: string
        reportTypeLabel:
          type: string
        type:
          type: string
      type: object
    ReportCreateResponse:
      properties:
        json_url:
          type: string
        key:
          type: string
        message:
          type: string
        notes:
          items:
            type: string
          type: array
        ok:
          type: boolean
        run_url:
          type: string
      type: object
    ReportListResponse:
      properties:
        count:
          type: integer
        items:
          items:
            $ref: '#/components/schemas/ReportSummary'
          type: array
      type: object
    ReportMutationResponse:
      properties:
        key:
          type: string
        ok:
          type: boolean
      type: object
    ReportSummary:
      properties:
        datasource:
          type: string
        description:
          type: string
        format:
          type: string
        has_thumbnail:
          type: boolean
        key:
          type: string
        name:
          type: string
        type:
          description: jasper | map
          type: string
      type: object
    Resource:
      properties:
        created_at:
          format: date-time
          type: string
        created_by:
          format: int64
          type: integer
        display_name:
          type: string
        extension:
          type: string
        folder_id:
          format: int64
          type: integer
        folder_path:
          type: string
        has_alpha:
          type: boolean
        height:
          type: integer
        id:
          format: int64
          type: integer
        mime_type:
          type: string
        original_filename:
          type: string
        resource_path:
          type: string
        resource_type:
          enum:
            - public_key
            - private_key
            - client_certificate
            - ca_certificate
            - generic_file
            - image
          type: string
        sha256:
          type: string
        size_bytes:
          format: int64
          type: integer
        storage_filename:
          type: string
        updated_at:
          format: date-time
          type: string
        uuid:
          format: uuid
          type: string
        width:
          type: integer
      type: object
    ResourceCreateJSON:
      properties:
        content:
          description: Pasted text content (JSON create path)
          type: string
        display_name:
          type: string
        extension:
          type: string
        folder_id:
          format: int64
          type: integer
        mime_type:
          type: string
        original_filename:
          type: string
        resource_type:
          type: string
      required:
        - display_name
        - resource_type
        - content
      type: object
    ResourceUpdateRequest:
      properties:
        display_name:
          type: string
        folder_id:
          format: int64
          type: integer
        resource_type:
          type: string
      type: object
    SavedView:
      properties:
        aggregates:
          items:
            $ref: '#/components/schemas/ExplorerAggregate'
          type: array
        can_edit:
          description: Present on GET responses
          type: boolean
        chart:
          additionalProperties: true
          type: object
        columns:
          items:
            type: string
          type: array
        created_at:
          format: date-time
          type: string
        dashboard_widget:
          deprecated: true
          description: Legacy alias of is_dashboard
          type: boolean
        datasource:
          type: string
        description:
          type: string
        filters:
          items:
            $ref: '#/components/schemas/ExplorerFilter'
          type: array
        folder_id:
          description: Optional folder placement on create/update
          format: int64
          type: integer
        group_by:
          items:
            type: string
          type: array
        is_dashboard:
          description: When true, this saved view is designated as a Dashboard (same object; no separate dashboard record)
          type: boolean
        key:
          type: string
        limit:
          type: integer
        map:
          additionalProperties: true
          type: object
        name:
          type: string
        owner_username:
          type: string
        panel_layout:
          additionalProperties: true
          type: object
        ref:
          description: Stable owner/key reference
          type: string
        report_key:
          type: string
        report_name:
          type: string
        schema:
          type: string
        sort:
          items:
            $ref: '#/components/schemas/ExplorerSort'
          type: array
        source_mode:
          type: string
        table:
          type: string
        updated_at:
          format: date-time
          type: string
        widgets:
          items:
            additionalProperties: true
            type: object
          type: array
      type: object
    SearchHit:
      properties:
        content_key:
          type: string
        content_type:
          type: string
        description:
          type: string
        folder_id:
          format: int64
          type: integer
        folder_path:
          type: string
        icon:
          type: string
        id:
          format: int64
          type: integer
        kind:
          enum:
            - folder
            - item
          type: string
        name:
          type: string
        resource_type:
          description: For explorer_view items, "view" or "dashboard"
          type: string
      type: object
    SetFolderPermissionsRequest:
      properties:
        group_names:
          items:
            type: string
          type: array
        permission:
          description: Default view
          example: view
          type: string
      required:
        - group_names
      type: object
    SetViewPermissionsRequest:
      properties:
        group_names:
          description: Replaces Access Group grants (no permission level field)
          items:
            type: string
          type: array
      required:
        - group_names
      type: object
    SuccessResponse:
      additionalProperties: true
      properties:
        message:
          type: string
        ok:
          example: true
          type: boolean
      type: object
    TableMeta:
      properties:
        columns:
          items:
            $ref: '#/components/schemas/ExplorerColumn'
          type: array
        datasource:
          type: string
        engine:
          type: string
        geometry_column:
          type: string
        primary_key:
          items:
            type: string
          type: array
        schema:
          type: string
        spatial_capable:
          type: boolean
        srid:
          type: integer
        table:
          type: string
      type: object
    Token:
      description: Plaintext personal access token (returned once on create/rotate)
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        message:
          example: This token will only be shown once.
          type: string
        name:
          type: string
        token:
          description: Full plaintext PAT (`jrs_…`); shown only once
          example: jrs_abcdefghijklmnopqrstuvwxyz0123456789
          type: string
      type: object
    TokenMetadata:
      description: Personal access token metadata (no secret)
      properties:
        active:
          type: boolean
        created_at:
          format: date-time
          type: string
        created_by_ip:
          type: string
        description:
          type: string
        expires_at:
          format: date-time
          nullable: true
          type: string
        id:
          format: int64
          type: integer
        last_used_at:
          format: date-time
          nullable: true
          type: string
        last_used_ip:
          type: string
        name:
          type: string
        revoked_at:
          format: date-time
          nullable: true
          type: string
        scopes:
          items:
            type: string
          type: array
        token_prefix:
          example: jrs_abcdef12
          type: string
        updated_at:
          format: date-time
          type: string
        user_id:
          format: int64
          type: integer
      type: object
    UpdateFolderRequest:
      properties:
        acl_inherit:
          type: boolean
        description:
          type: string
        icon:
          type: string
        name:
          type: string
        sort_order:
          type: integer
      type: object
    UpdateTokenRequest:
      properties:
        description:
          type: string
        expires_at:
          type: string
        expires_in:
          enum:
            - never
            - 30d
            - 90d
            - 1y
            - custom
          type: string
        name:
          type: string
      type: object
    User:
      description: Authenticated user identity (`GET /api/v1/auth/me`)
      example:
        email: admin@example.com
        groups:
          - Administrators
        id: 1
        is_admin: true
        permissions: []
        username: admin
      properties:
        auth_disabled:
          description: Present when JRS_AUTH_DISABLED is set
          type: boolean
        email:
          type: string
        groups:
          items:
            type: string
          type: array
        id:
          format: int64
          type: integer
        is_admin:
          type: boolean
        permissions:
          description: Reserved; tokens inherit full user ACL (currently empty)
          items:
            type: string
          type: array
        username:
          type: string
      type: object
    ValidationError:
      additionalProperties: true
      properties:
        error:
          type: string
        errors:
          items:
            type: string
          type: array
      required:
        - error
      type: object
    ViewPermissions:
      description: Access Groups ACL for a saved explorer view or dashboard
      properties:
        available_groups:
          items:
            type: string
          type: array
        can_edit:
          type: boolean
        group_names:
          example:
            - Sales
            - Ops
          items:
            type: string
          type: array
        ref:
          example: alice/sales-overview
          type: string
        resource_type:
          example: explorer_view
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: jrs_PAT
      description: |
        Personal access token with prefix `jrs_`.
        Create tokens via `POST /api/v1/auth/tokens` or the Profile UI.
      scheme: bearer
      type: http
    SessionCookie:
      description: Browser session cookie created by `POST /api/v1/auth/login`.
      in: cookie
      name: jrs_session
      type: apiKey
info:
  contact:
    name: AcuGIS
  description: |
    Official OpenAPI 3.0 contract for the AcuGIS Report Server REST API.

    This specification documents **existing** programmatic endpoints only.
    HTML UI pages and form-only admin surfaces are intentionally omitted.

    **Authentication:** Session cookie `jrs_session` or Bearer personal access
    token (`Authorization: Bearer jrs_…`). Both produce the same authenticated
    user. Prefer `/api/v1/*` routes for new clients.

    **Version:** `info.version` matches `JRS_APP_VERSION` / product release when
    served from the Report Server (`GET /api/openapi.yaml`).

    **Modular sources:** Path modules and `schemas.yaml` are merged at serve time.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
  title: AcuGIS Report Server API
  version: 0.1.0-foundation
openapi: 3.0.3
paths:
  /api/resource-sync/:
    get:
      deprecated: true
      description: Prefer `GET /api/v1/resource-sync`.
      operationId: getResourceSyncAlias
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Sync hint
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: Resource sync hint (legacy alias)
      tags:
        - Resources
    post:
      deprecated: true
      description: Prefer `POST /api/v1/resource-sync`.
      operationId: runResourceSyncAlias
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Sync completed
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Run resource sync (legacy alias)
      tags:
        - Resources
  /api/resource-sync/index.php:
    get:
      deprecated: true
      description: Prefer `GET /api/v1/resource-sync`.
      operationId: getResourceSyncIndexPHP
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Sync hint
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: Resource sync hint (PHP alias)
      tags:
        - Resources
    post:
      deprecated: true
      description: Prefer `POST /api/v1/resource-sync`.
      operationId: runResourceSyncIndexPHP
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: Sync completed
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Run resource sync (PHP alias)
      tags:
        - Resources
  /api/v1/auth/login:
    post:
      description: |
        Creates a `jrs_session` cookie. Accepts JSON or form-urlencoded credentials.
        Public endpoint (no prior auth required).
      operationId: login
      requestBody:
        content:
          application/json:
            example:
              password: secret
              username: admin
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                ok: true
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Session cookie set
          headers:
            Set-Cookie:
              description: jrs_session cookie
              schema:
                type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          content:
            application/json:
              example:
                error: invalid credentials
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid credentials
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
      summary: Create browser session
      tags:
        - Authentication
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          content:
            application/json:
              example:
                ok: true
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Cookie cleared
        "405":
          $ref: '#/components/responses/BadRequest'
      security: []
      summary: Clear browser session
      tags:
        - Authentication
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: User identity
        "401":
          $ref: '#/components/responses/Unauthorized'
      summary: Current authenticated user
      tags:
        - Authentication
  /api/v1/auth/tokens:
    get:
      description: Returns metadata only (no plaintext secrets).
      operationId: listTokens
      responses:
        "200":
          content:
            application/json:
              example:
                tokens:
                  - active: true
                    id: 1
                    name: CI Server
                    token_prefix: jrs_abcdef12
              schema:
                properties:
                  tokens:
                    items:
                      $ref: '#/components/schemas/TokenMetadata'
                    type: array
                type: object
          description: Token list
        "401":
          $ref: '#/components/responses/Unauthorized'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
      summary: List personal access tokens
      tags:
        - Authentication
    post:
      description: Returns the plaintext token once. Store it securely; it cannot be retrieved again.
      operationId: createToken
      requestBody:
        content:
          application/json:
            example:
              description: GitHub Actions
              expires_in: 90d
              name: CI Server
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
          description: Created
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Create personal access token
      tags:
        - Authentication
  /api/v1/auth/tokens/{id}:
    delete:
      description: Soft-revokes by default. Pass `purge=1` for hard delete.
      operationId: deleteToken
      parameters:
        - description: When true, permanently delete the token row
          in: query
          name: purge
          schema:
            type: boolean
      responses:
        "204":
          description: Revoked or deleted
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Revoke or purge token
      tags:
        - Authentication
    parameters:
      - $ref: '#/components/parameters/TokenId'
    put:
      operationId: updateToken
      requestBody:
        content:
          application/json:
            example:
              description: updated
              name: CI Server (renamed)
            schema:
              $ref: '#/components/schemas/UpdateTokenRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenMetadata'
          description: Updated metadata
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Update token metadata
      tags:
        - Authentication
  /api/v1/auth/tokens/{id}/rotate:
    post:
      description: Revokes the existing token and issues a new plaintext secret once.
      operationId: rotateToken
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
          description: New plaintext token
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Rotate personal access token
      tags:
        - Authentication
  /api/v1/content/move:
    post:
      operationId: moveContent
      requestBody:
        content:
          application/json:
            example:
              content_key: nycdata
              content_type: jasper_report
              display_name: NYC Data
              folder_id: 12
            schema:
              $ref: '#/components/schemas/MoveContentRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
          description: Content item
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: Place or move content into a folder
      tags:
        - Folders
  /api/v1/datasources:
    get:
      description: |
        Returns an array of `{name}` objects only (no connection details).

        **Limitations (current API):**
        - List returns names only — no host, credentials, or metadata
        - No GET-by-id endpoint
        - No dedicated PUT; create POST upserts by `name`
        - Empty array when the datasource store is unavailable (not 503)
      operationId: listDatasources
      responses:
        "200":
          content:
            application/json:
              example:
                - name: reporting_db
                - name: MainPG
              schema:
                items:
                  $ref: '#/components/schemas/DatasourceName'
                type: array
          description: Datasource names
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: List datasource names
      tags:
        - Datasources
    post:
      description: |
        Service-admin only. Body is **application/x-www-form-urlencoded** (not JSON).

        Upsert by `name` with connection fields, or delete via `action=delete` + `id`.

        **Limitations:** no dedicated PUT; POST upserts by name. No GET-by-id.
      operationId: createDatasource
      requestBody:
        content:
          application/x-www-form-urlencoded:
            examples:
              bigquery:
                summary: Google BigQuery (collection fill)
                value:
                  credentials_resource_uuid: 11111111-2222-3333-4444-555555555555
                  db_type: bigquery
                  dbname: flawless-spirit-386523
                  default_dataset: demo
                  location: US
                  name: My BigQuery
              cassandra_astra:
                summary: DataStax Astra (Data API)
                value:
                  connection_method: astra
                  db_type: cassandra
                  dbname: default_keyspace
                  host: https://xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx-us-east-2.apps.astra.datastax.com
                  name: AstraCustomers
                  password: AstraCS:example-token
              delete:
                summary: Delete via POST action
                value:
                  action: delete
                  id: "3"
              duckdb_database:
                summary: DuckDB database file on server
                value:
                  db_type: duckdb
                  dbname: /srv/data/analytics.duckdb
                  duckdb_mode: database
                  name: Analytics
              duckdb_files:
                summary: DuckDB remote Parquet (collection fill)
                value:
                  db_type: duckdb
                  duckdb_auth_type: none
                  duckdb_format: parquet
                  duckdb_mode: files
                  duckdb_remote_source: https://acugis.cloud/yellow_tripdata_2024-01.parquet
                  name: NYC Taxi
              upsert:
                summary: Create or update by name
                value:
                  auth_type: password
                  db_type: postgresql
                  dbname: reporting
                  host: db.example.com
                  name: reporting_db
                  password: secret
                  port: "5432"
                  schema_name: public
                  username: reporter
            schema:
              properties:
                action:
                  description: When `delete`, remove by `id` instead of upsert
                  enum:
                    - delete
                  type: string
                auth_type:
                  description: e.g. password or key-based auth
                  type: string
                connection_method:
                  description: Cassandra only — `standard` or `astra` (Designer-compatible).
                  enum:
                    - standard
                    - astra
                  type: string
                credentials_resource_uuid:
                  description: BigQuery only — Service Account JSON content resource UUID. On update, omit or leave blank to keep the existing credential reference. Never send raw JSON.
                  format: uuid
                  type: string
                db_type:
                  example: postgresql
                  type: string
                dbname:
                  example: reporting
                  type: string
                default_dataset:
                  description: BigQuery only — optional default dataset (schema).
                  example: demo
                  type: string
                duckdb_alias:
                  description: DuckDB Data Files optional logical alias (defaults from URL basename).
                  type: string
                duckdb_auth_type:
                  description: DuckDB Data Files HTTP authentication (Designer-compatible).
                  enum:
                    - none
                    - basic
                    - bearer
                    - headers
                  type: string
                duckdb_format:
                  description: DuckDB Data Files format (Auto Detect / Parquet / CSV / JSON).
                  enum:
                    - auto
                    - parquet
                    - csv
                    - json
                  type: string
                duckdb_header_keys:
                  description: DuckDB Custom Headers mode — comma-separated or JSON array of header names (values in password).
                  type: string
                duckdb_mode:
                  description: DuckDB only — database file path mode or remote Data Files mode.
                  enum:
                    - database
                    - files
                  type: string
                duckdb_remote_source:
                  description: DuckDB Data Files only — HTTP(S) URL queried directly by DuckDB.
                  type: string
                host:
                  example: db.example.com
                  type: string
                id:
                  description: Numeric id when `action=delete`
                  type: string
                local_datacenter:
                  description: Cassandra standard only — local datacenter name.
                  example: datacenter1
                  type: string
                location:
                  description: BigQuery only — optional job location (US, EU, us-central1).
                  example: US
                  type: string
                name:
                  description: Datasource name (upsert key)
                  example: reporting_db
                  type: string
                password:
                  description: On update, omit or leave blank to keep the existing password/token.
                  format: password
                  type: string
                port:
                  example: "5432"
                  type: string
                private_key_resource_uuid:
                  format: uuid
                  type: string
                public_key_resource_uuid:
                  format: uuid
                  type: string
                schema_name:
                  example: public
                  type: string
                username:
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                message: Datasource saved
                ok: true
              schema:
                $ref: '#/components/schemas/DatasourceMutationResponse'
          description: Mutation succeeded
        "400":
          content:
            application/json:
              example:
                error: validation failed
                errors:
                  - name is required
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: Validation failed
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          content:
            application/json:
              example:
                error: datasource store unavailable
              schema:
                $ref: '#/components/schemas/Error'
          description: Datasource store unavailable
      summary: Create or upsert datasource
      tags:
        - Datasources
  /api/v1/datasources/{id}:
    delete:
      description: |
        Service-admin only. Path `{id}` is preferred; the handler also accepts
        a query `id` as a fallback.
      operationId: deleteDatasource
      responses:
        "200":
          content:
            application/json:
              example:
                ok: true
              schema:
                $ref: '#/components/schemas/DatasourceMutationResponse'
          description: Deleted
        "400":
          content:
            application/json:
              example:
                error: id required
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing id
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: Delete datasource by id
      tags:
        - Datasources
    parameters:
      - $ref: '#/components/parameters/DatasourceId'
  /api/v1/datasources/context:
    post:
      description: |
        Service-edit ACL. Writes JasperReports Server style `context.xml` from
        configured datasources and returns the path plus notes. Cassandra/Astra
        and Google BigQuery datasources are omitted (collection fill, not JDBC JNDI).
      operationId: generateJasperContext
      responses:
        "200":
          content:
            application/json:
              example:
                notes:
                  - Wrote 2 datasources
                ok: true
                path: /var/lib/jasper/context.xml
              schema:
                $ref: '#/components/schemas/JasperContextResponse'
          description: Context generated
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          content:
            text/plain:
              example: No datasources configured
              schema:
                type: string
          description: Generation failed (often plain text for legacy clients)
      summary: Generate Jasper context.xml
      tags:
        - Datasources
  /api/v1/datasources/test:
    post:
      description: |
        Service-admin only. Verifies Standard Cassandra (gocql), DataStax Astra
        (Data API), Google BigQuery, or DuckDB using the same form fields as create/upsert.
        Blank password/token (Cassandra/DuckDB) or blank credentials_resource_uuid (BigQuery)
        reloads the saved secret/reference when `name` matches an existing datasource.
        Secrets and Service Account JSON contents are never returned.
      operationId: testDatasource
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                connection_method:
                  enum:
                    - standard
                    - astra
                  type: string
                credentials_resource_uuid:
                  description: BigQuery Service Account JSON resource UUID
                  format: uuid
                  type: string
                db_type:
                  example: cassandra
                  type: string
                dbname:
                  description: Keyspace (Cassandra) or Project ID (BigQuery)
                  type: string
                default_dataset:
                  description: BigQuery optional default dataset
                  type: string
                host:
                  description: Contact points or Astra HTTPS API endpoint
                  type: string
                local_datacenter:
                  type: string
                location:
                  description: BigQuery optional location
                  type: string
                name:
                  type: string
                password:
                  description: Cassandra password or Astra token
                  format: password
                  type: string
                port:
                  example: "9042"
                  type: string
                username:
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                message: Connected · https://….apps.astra.datastax.com
                ok: true
              schema:
                properties:
                  message:
                    type: string
                  ok:
                    type: boolean
                type: object
          description: Test result (ok may still be false)
        "400":
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  ok:
                    type: boolean
                type: object
          description: Validation failed or unsupported type
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: Test Cassandra / Astra / BigQuery / DuckDB datasource connectivity
      tags:
        - Datasources
  /api/v1/diagnostics:
    get:
      description: |
        Public. Redacted runtime/config diagnostics (secrets never included).
        Useful for support and deployment verification.
      operationId: getDiagnostics
      responses:
        "200":
          content:
            application/json:
              example:
                app_version: 0.1.0-foundation
                auth_disabled: false
                base_path: /go
                environment: production
                filesystem_paths_present: true
                go_version: go1.22.5
                jasper_endpoint_configured: true
                jasper_reachable: "true"
                postgres_reachable: true
                service: acugis-report-server-go
                timestamp: "2026-08-06T05:00:00Z"
              schema:
                $ref: '#/components/schemas/Diagnostics'
          description: Diagnostics snapshot
      security: []
      summary: Ops diagnostics
      tags:
        - Health
  /api/v1/embedded-map/debug:
    get:
      description: |
        Service-edit + report-edit ACL. Inspects JRXML/Jasper embedded-map
        wiring for a report. With `format=json` (or Accept JSON) returns JSON;
        otherwise HTML with a `<pre>` dump. Optional `compile` triggers a
        compile attempt.
      operationId: debugEmbeddedMap
      parameters:
        - description: Report key
          example: nycdata
          in: query
          name: report
          required: true
          schema:
            type: string
        - description: Force JSON response
          example: json
          in: query
          name: format
          schema:
            enum:
              - json
            type: string
        - description: Any value triggers compile attempt
          in: query
          name: compile
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              example:
                embeddedMap:
                  enabled: true
                jasper:
                  exists: true
                  stale: false
                jrxml:
                  exists: true
                  hasImageElement: true
                  hasParameter: true
                layer:
                  datasource: reporting_db
                  geometry_column: geom
                  table: parcels
                report: nycdata
              schema:
                additionalProperties: true
                properties:
                  compileAttempt:
                    additionalProperties: true
                    type: object
                  embeddedMap:
                    additionalProperties: true
                    type: object
                  jasper:
                    additionalProperties: true
                    type: object
                  jrxml:
                    additionalProperties: true
                    type: object
                  layer:
                    additionalProperties: true
                    type: object
                  render:
                    additionalProperties: true
                    type: object
                  renderError:
                    type: string
                  report:
                    type: string
                  runtime:
                    additionalProperties: true
                    type: object
                type: object
            text/html:
              schema:
                type: string
          description: Debug payload
        "400":
          content:
            text/plain:
              example: Pass ?report=<key>
              schema:
                type: string
          description: Missing report key
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: Debug embedded map configuration
      tags:
        - Embedded Maps
  /api/v1/favorites:
    get:
      operationId: listFavorites
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/ContentItem'
                    type: array
                type: object
          description: Favorite items
        "401":
          $ref: '#/components/responses/Unauthorized'
      summary: List favorites
      tags:
        - Folders
    post:
      operationId: setFavorite
      requestBody:
        content:
          application/json:
            example:
              content_key: nycdata
              content_type: jasper_report
              favorite: true
            schema:
              $ref: '#/components/schemas/FavoriteRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                favorite: true
                ok: true
              schema:
                properties:
                  favorite:
                    type: boolean
                  ok:
                    type: boolean
                type: object
          description: Favorite state
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
      summary: Set or unset favorite
      tags:
        - Folders
  /api/v1/folders:
    post:
      operationId: createFolder
      requestBody:
        content:
          application/json:
            example:
              description: Finance reports
              icon: folder
              name: Finance
              parent_id: 0
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
          description: Created
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
      summary: Create folder
      tags:
        - Folders
  /api/v1/folders/{id}:
    delete:
      operationId: deleteFolder
      parameters:
        - in: query
          name: recursive
          schema:
            type: boolean
        - description: Required for destructive deletes
          in: query
          name: confirm
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              example:
                ok: true
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: Deleted
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not empty or conflict
      summary: Delete folder
      tags:
        - Folders
    get:
      operationId: getFolder
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
          description: Folder
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Get folder
      tags:
        - Folders
    parameters:
