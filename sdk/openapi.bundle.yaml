      description: Public. Returns process liveness; does not check dependencies.
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              example:
                service: acugis-report-server-go
                status: ok
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Healthy
      security: []
      summary: Liveness probe
      tags:
        - Health
  /ready:
    get:
      description: |
        Public. Checks postgres, filesystem paths, and Jasper reachability.
        Returns 503 when not ready.
      operationId: getReady
      responses:
        "200":
          content:
            application/json:
              example:
                checks:
                  filesystem:
                    ok: true
                  jasper:
                    configured: true
                    reachability: ok
                  postgres:
                    ok: true
                service: acugis-report-server-go
                status: ready
              schema:
                $ref: '#/components/schemas/ReadyResponse'
          description: Ready
        "503":
          content:
            application/json:
              example:
                checks:
                  postgres:
                    message: connection refused
                    ok: false
                service: acugis-report-server-go
                status: not_ready
              schema:
                $ref: '#/components/schemas/ReadyResponse'
          description: Not ready
      security: []
      summary: Readiness probe
      tags:
        - Health
