site_name: AcuGIS Report Server
site_description: Documentation for AcuGIS Report Server — User Guide, Administration, Developer Guide, and Reference
site_url: https://github.com/AcuGIS/acugis-report-server-ce
repo_url: https://github.com/AcuGIS/acugis-report-server-ce
repo_name: AcuGIS/acugis-report-server-ce
edit_uri: edit/main/documentation/docs/
docs_dir: docs
site_dir: site
strict: true
copyright: Copyright &copy; 2026 AcuGIS

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Plus Jakarta Sans
    code: IBM Plex Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/acugis/acugis-nav.css
  - stylesheets/extra.css

extra_javascript:
  - assets/acugis/acugis-nav.js

extra:
  generator: false
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AcuGIS/acugis-report-server-ce

plugins:
  - material/search
  - mike:
      canonical_version: latest
      version_selector: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
