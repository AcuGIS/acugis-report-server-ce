      - Resources: user-guide/resources.md
      - Datasources: user-guide/datasources.md
      - Embedded Maps: user-guide/embedded-maps.md
      - Report execution: user-guide/report-execution.md
      - Output formats: user-guide/output-formats.md
      - Searching: user-guide/searching.md
