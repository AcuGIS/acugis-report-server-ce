# Reverse-proxy AcuGIS Report Server (Go) on :9088.
# Tomcat/Jasper stays internal on :8080 and is not published here.
#
# The license origin check trusts X-Forwarded-Host when present, otherwise
# the Host header. ProxyPreserveHost keeps the browser Host on the backend.
# ProxyAddHeaders (Apache default) also sends X-Forwarded-Host. Both are
# set explicitly so a backend listen address is never treated as the public host.
#
# MCP on this loopback listener accepts loopback Host values plus the public
# hostnames in JRS_MCP_ALLOWED_HOSTS. Set that to the hostname preserved here.

ProxyPreserveHost On
ProxyAddHeaders On
RequestHeader set X-Forwarded-Proto "https" env=HTTPS
ProxyPass / http://127.0.0.1:9088/
ProxyPassReverse / http://127.0.0.1:9088/
