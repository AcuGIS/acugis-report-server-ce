# Sample external configuration for standalone Tomcat 10
# Copy to:  %CATALINA_BASE%\conf\acugis.properties   (Windows)
#       or: $CATALINA_BASE/conf/acugis.properties     (Linux/macOS)
#
# Priority: Environment variables > this file > WEB-INF/classes/application.properties

reports.dir=${catalina.base}/acugis/reports
uploads.dir=${catalina.base}/acugis/uploads
logs.dir=${catalina.base}/logs
temp.dir=${catalina.base}/temp
fonts.dir=${catalina.base}/acugis/fonts
drivers.dir=${catalina.base}/acugis/drivers
licenses.dir=${catalina.base}/acugis/licenses

# license.file=${catalina.base}/acugis/licenses/acugis.license

# html.image.uri.pattern={contextPath}/acugis_report_image?image={0}&uuid={uuid}
ignore.missing.font=true

# Optional: ArcGIS / GeoServer connection property files (absolute paths)
# -Dacugis.arcgis.connections.file=...
# -Dacugis.geoserver.connections.file=...
# or environment:
# ACUGIS_ARCGIS_CONNECTIONS_FILE=
# ACUGIS_GEOSERVER_CONNECTIONS_FILE=
