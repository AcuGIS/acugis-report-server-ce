# AcuGIS Report Server — internal defaults (standalone Tomcat 10)
# Override via environment variables or CATALINA_BASE/conf/acugis.properties
#
# Priority: Environment > CATALINA_BASE/conf/acugis.properties > this file > built-in defaults

reports.dir=${catalina.base}/acugis/reports
uploads.dir=${catalina.base}/acugis/uploads
logs.dir=${catalina.base}/logs
temp.dir=${catalina.base}/temp
fonts.dir=${catalina.base}/acugis/fonts
drivers.dir=${catalina.base}/acugis/drivers
licenses.dir=${catalina.base}/acugis/licenses

# Optional absolute path to a license file (also: ACUGIS_LICENSE_FILE / LICENSE_FILE)
license.file=

# HTML image URLs use the request context path (works for ROOT and named WARs)
html.image.uri.pattern={contextPath}/acugis_report_image?image={0}&uuid={uuid}

# Avoid AWT/font crashes when a JRXML references a missing Windows font
ignore.missing.font=true
