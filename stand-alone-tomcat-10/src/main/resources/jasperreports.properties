# Prefer raster PNG for Barcode4J / QR so HTML export stores img_*.png
# (SVG + wrong Content-Type breaks under X-Content-Type-Options: nosniff).
# QR codes share image.producer; qrcode.producer.{alias} maps alias → class.
net.sf.jasperreports.components.barcode4j.image.producer=image

# Designer collection languages. JR 7 reads these from the JasperReportsContext
# (this file), not from System properties. Fill uses JRMapCollectionDataSource.
net.sf.jasperreports.query.executer.factory.cassandra=com.acugis.reports.CollectionQueryExecuterFactory
net.sf.jasperreports.query.executer.factory.collection=com.acugis.reports.CollectionQueryExecuterFactory
net.sf.jasperreports.query.executer.factory.Cassandra=com.acugis.reports.CollectionQueryExecuterFactory
net.sf.jasperreports.query.executer.factory.COLLECTION=com.acugis.reports.CollectionQueryExecuterFactory
