name: SDK Go

on:
  push:
    branches: [main, master]
    paths:
      - "sdk/go/**"
      - "sdk/openapi.bundle.yaml"
      - ".github/workflows/sdk-go.yml"
  pull_request:
    paths:
      - "sdk/go/**"
      - "sdk/openapi.bundle.yaml"
      - ".github/workflows/sdk-go.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: sdk/go/go.sum

      - name: go test
        run: go test ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build examples
        run: |
          go build -o /tmp/acugis-go-console ./examples/console
          go build -o /tmp/acugis-go-http ./examples/http-server
