name: Docs

# GitHub Pages publication is intentionally disabled.
# This workflow only validates the documentation build.
# Do not add a Pages deploy until publication is a deliberate decision.

on:
  push:
    branches: [main, master]
    paths:
      - "documentation/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "documentation/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r documentation/requirements.txt

      - name: Build site (strict)
        working-directory: documentation
        run: mkdocs build --strict
