name: SDK Java

on:
  push:
    branches: [main, master]
    paths:
      - "sdk/java/**"
      - ".github/workflows/sdk-java.yml"
  pull_request:
    paths:
      - "sdk/java/**"
      - ".github/workflows/sdk-java.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Test
        run: ./mvnw -B test

      - name: Package (no deploy)
        run: ./mvnw -B package -DskipTests
